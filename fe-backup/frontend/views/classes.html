<section class="classes-section spad">

            <div class="col-lg-12">
                <div class="section-title">
                    <span>Our Classes</span>
                    <h2>FIND YOUR PERFECT WORKOUT</h2>
                </div>
                <!-- Filter Controls - Matches Category IDs in your DB -->
                <div class="class-controls" style="text-align: center; margin-bottom: 40px;">
                    <button class="filter-btn active" data-filter="all" style="background: none; border: none; color: #f36100; font-weight: 700; margin: 0 15px; cursor: pointer; text-transform: uppercase;">All</button>

                    <button class="filter-btn" data-filter="2" style="background: none; border: none; color: #c4c4c4; font-weight: 700; margin: 0 15px; cursor: pointer; text-transform: uppercase;">Mind & Body</button>
                    <button class="filter-btn" data-filter="3" style="background: none; border: none; color: #c4c4c4; font-weight: 700; margin: 0 15px; cursor: pointer; text-transform: uppercase;">Cardio</button>
                    <button class="filter-btn" data-filter="4" style="background: none; border: none; color: #c4c4c4; font-weight: 700; margin: 0 15px; cursor: pointer; text-transform: uppercase;">Combat</button>
                    <button class="filter-btn" data-filter="5" style="background: none; border: none; color: #c4c4c4; font-weight: 700; margin: 0 15px; cursor: pointer; text-transform: uppercase;">Nutrition</button>
                </div>
            </div>
        </div>

        <div class="row" id="classesGrid">



        </div>
    </div>

<script>
    ClassesService.getClasses();
</script>

<script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const filter = this.dataset.filter;

            // Update active button state
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.style.color = '#c4c4c4';
                b.classList.remove('active');
            });
            this.style.color = '#f36100';
            this.classList.add('active');

            // Filter logic based on Category ID
            document.querySelectorAll('.class-item').forEach(item => {
                if (filter === 'all' || item.dataset.category === filter) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
