    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="breadcrumb-text">
                    <h2 style="color: #f36100; font-size: 48px; margin-bottom: 10px; margin-top: 64px;">Login</h2>
                    <div class="bt-option">
                        <span style="color: #c4c4c4;">Login</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- Login Section Begin -->
<section class="contact-section spad" style="padding: 80px 0; background: #151515;">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3">
                <div class="section-title contact-title" style="text-align: center; margin-bottom: 50px;">
                    <span style="color: #f36100; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Welcome Back</span>
                    <h2 style="color: #ffffff; font-size: 36px; margin-top: 10px;">LOGIN TO YOUR ACCOUNT</h2>
                </div>
                
                <div style="background: #0a0a0a; padding: 50px 40px; border-radius: 8px; border: 1px solid #363636;">
                    <form id="loginForm">
                        <div class="form-group">
                            <label style="color: #ffffff; margin-bottom: 10px; font-weight: 600;">Email Address</label>
                            <input type="email" 
                                   id="email" 
                                   name="email" 
                                   required
                                   placeholder="your.email@example.com"
                                   style="font-size: 14px; color: #c4c4c4; width: 100%; height: 50px; border: 1px solid #363636; padding-left: 20px; background: transparent; margin-bottom: 20px; border-radius: 4px;">
                        </div>

                        <div class="form-group">
                            <label style="color: #ffffff; margin-bottom: 10px; font-weight: 600;">Password</label>
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   required
                                   placeholder="Enter your password"
                                   style="font-size: 14px; color: #c4c4c4; width: 100%; height: 50px; border: 1px solid #363636; padding-left: 20px; background: transparent; margin-bottom: 20px; border-radius: 4px;">
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <label style="color: #c4c4c4; font-size: 14px; cursor: pointer; display: flex; align-items: center;">
                                <input type="checkbox" style="margin-right: 8px;"> Remember Me
                            </label>
                            <a href="#" style="color: #f36100; font-size: 14px; text-decoration: none;">Forgot Password?</a>
                        </div>

                        <button type="submit" 
                                class="primary-btn"
                                style="width: 100%; padding: 15px; border: none; cursor: pointer; background: #f36100; color: #ffffff; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; border-radius: 4px; transition: all 0.3s;">
                            LOGIN
                        </button>

                        <div style="text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid #363636;">
                            <p style="color: #c4c4c4; margin-bottom: 15px;">Don't have an account?</p>
                            <a href="#/register" class="nav-link" style="color: #f36100; font-weight: 600; text-decoration: none; font-size: 16px;">
                                CREATE NEW ACCOUNT →
                            </a>
                        </div>
                    </form>
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <p style="color: #888888; font-size: 13px;">
                        <i class="fa fa-lock" style="margin-right: 5px;"></i>
                        Your data is secure and encrypted
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Login Section End -->
