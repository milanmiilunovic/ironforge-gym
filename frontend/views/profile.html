<!-- Profile Section Begin -->
<section class="contact-section spad">
    <div class="container">
        <div class="row">
            <!-- Profile Sidebar -->
            <div class="col-lg-4">
                <div style="background: #0a0a0a; padding: 30px; border-radius: 8px; border: 1px solid #363636; text-align: center; margin-bottom: 30px;">
                    <div style="width: 150px; height: 150px; border-radius: 50%; background: #252525; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; border: 4px solid #f36100;">
                        <i class="fa fa-user" style="font-size: 60px; color: #f36100;"></i>
                    </div>
                    <!-- ID used: full-name-h4 -->
                    <h4 id="full-name-h4" style="color: #ffffff; font-weight: 600; margin-bottom: 5px;">Loading...</h4>
                    <p style="color: #f36100; font-size: 14px; font-weight: 600; text-transform: uppercase; margin-bottom: 20px;">PREMIUM MEMBER</p>
                    <div style="background: #151515; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: left;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="color: #c4c4c4; font-size: 14px;">Member Since:</span>
                            <!-- ID used: membership-date -->
                            <span id="membership-date" style="color: #ffffff; font-size: 14px; font-weight: 600;">...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="col-lg-8">
                <div style="background: #0a0a0a; padding: 40px; border-radius: 8px; border: 1px solid #363636;">
                    <h4 style="color: #ffffff; font-weight: 600; margin-bottom: 30px; display: flex; align-items: center;">
                        <i class="fa fa-user-circle" style="color: #f36100; margin-right: 10px;"></i>
                        Personal Information
                    </h4>
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label style="color: #ffffff; margin-bottom: 10px; font-weight: 600;">Full Name</label>
                                    <!-- ID used: full-name-form -->
                                    <input type="text"
                                           id="full-name-form"
                                           placeholder="Enter full name"
                                           style="font-size: 14px; color: #c4c4c4; width: 100%; height: 50px; border: 1px solid #363636; padding-left: 20px; background: transparent; margin-bottom: 20px;">
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label style="color: #ffffff; margin-bottom: 10px; font-weight: 600;">Email Address</label>
                                    <!-- ID used: email-form -->
                                    <input type="email"
                                           id="email-form"
                                           placeholder="Enter email"
                                           style="font-size: 14px; color: #c4c4c4; width: 100%; height: 50px; border: 1px solid #363636; padding-left: 20px; background: transparent; margin-bottom: 20px;">
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Profile Section End -->
